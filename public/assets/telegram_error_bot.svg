<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%" style="background:#0e1621; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="tgHeaderRedGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1822"/>
      <stop offset="100%" stop-color="#2c1f2f"/>
    </linearGradient>
    <linearGradient id="tgBubbleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182533"/>
      <stop offset="100%" stop-color="#202f42"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Status Bar -->
  <rect width="420" height="42" fill="#17212b"/>
  <text x="24" y="27" fill="#ffffff" font-size="14" font-weight="600">12:39</text>
  <path d="M352 18 h16 v10 h-16 z M370 21 h3 v4 h-3 z" fill="#a0b3c6"/>
  <text x="320" y="27" fill="#a0b3c6" font-size="12">53%</text>

  <!-- Telegram Chat Header -->
  <rect y="42" width="420" height="64" fill="url(#tgHeaderRedGrad)"/>
  <path d="M26 74 l10 -10 m-10 10 l10 10 m-10 -10 h24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bot Avatar (Red/Coral S) -->
  <circle cx="92" cy="74" r="22" fill="#e15b5b"/>
  <text x="92" y="81" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">S</text>
  <!-- Bot Name & Status -->
  <text x="126" y="69" fill="#ffffff" font-size="16" font-weight="600">Shopify_error_massage_bot</text>
  <text x="126" y="87" fill="#f87171" font-size="12">bot · health monitor &amp; failover</text>
  <!-- Three dots -->
  <circle cx="390" cy="68" r="2.5" fill="#ffffff"/>
  <circle cx="390" cy="74" r="2.5" fill="#ffffff"/>
  <circle cx="390" cy="80" r="2.5" fill="#ffffff"/>

  <!-- Chat Wallpaper -->
  <rect y="106" width="420" height="700" fill="#0e1621"/>

  <!-- Alert Bubble 1: Site Health Status DOWN -->
  <g filter="url(#cardShadow)">
    <rect x="18" y="130" width="384" height="136" rx="14" fill="url(#tgBubbleGrad)" stroke="#7f1d1d" stroke-width="1.2"/>
    <text x="36" y="162" fill="#ef4444" font-size="15" font-weight="700">🔴 Site Health Status Change: Soko Glam</text>
    <text x="36" y="184" fill="#ffffff" font-size="14.5" font-weight="600">Skincare</text>
    <text x="36" y="214" fill="#cbd5e1" font-size="13">Status changed from <tspan fill="#10b981" font-weight="600">ok</tspan> → <tspan fill="#ef4444" font-weight="700">DOWN</tspan>.</text>
    <text x="36" y="238" fill="#94a3b8" font-size="12.5">Context: <tspan fill="#fca5a5">Network crashed completely</tspan></text>
    <text x="366" y="254" fill="#6c8ba8" font-size="11">12:34</text>
  </g>

  <!-- Alert Bubble 2: Price Alert Delivery Failed -->
  <g filter="url(#cardShadow)">
    <rect x="18" y="280" width="384" height="154" rx="14" fill="url(#tgBubbleGrad)" stroke="#b45309" stroke-width="1.2"/>
    <text x="36" y="312" fill="#f59e0b" font-size="15" font-weight="700">⚠️ Price Alert Delivery Failed to Team Chat</text>
    <text x="36" y="342" fill="#e2e8f0" font-size="13">Team alerts could not be sent. Events will</text>
    <text x="36" y="362" fill="#e2e8f0" font-size="13">be held and retried next run.</text>
    <text x="36" y="392" fill="#fcd34d" font-size="12.5">Reason: Failed to send 1 price alert message(s).</text>
    <text x="366" y="420" fill="#6c8ba8" font-size="11">12:35</text>
  </g>

  <!-- Alert Bubble 3: Recovered Green Alert -->
  <g filter="url(#cardShadow)">
    <rect x="18" y="448" width="384" height="124" rx="14" fill="url(#tgBubbleGrad)" stroke="#065f46" stroke-width="1.2"/>
    <text x="36" y="480" fill="#10b981" font-size="15" font-weight="700">🟢 Team Notification Delivery Recovered</text>
    <text x="36" y="510" fill="#e2e8f0" font-size="13">Price alerts are delivering successfully</text>
    <text x="36" y="530" fill="#e2e8f0" font-size="13">again.</text>
    <text x="366" y="558" fill="#6c8ba8" font-size="11">12:35</text>
  </g>

  <!-- Alert Bubble 4: Retry & Red Alert -->
  <g filter="url(#cardShadow)">
    <rect x="18" y="586" width="384" height="196" rx="14" fill="url(#tgBubbleGrad)" stroke="#7f1d1d" stroke-width="1.2"/>
    <text x="36" y="618" fill="#f59e0b" font-size="15" font-weight="700">⚠️ Price Alert Delivery Failed to Team Chat</text>
    <text x="36" y="648" fill="#e2e8f0" font-size="13">Events queued for next auto-recovery cycle.</text>
    <text x="36" y="678" fill="#ef4444" font-size="15" font-weight="700">🔴 Site Health Status Change: Soko Glam</text>
    <text x="36" y="700" fill="#cbd5e1" font-size="13">Status changed from <tspan fill="#10b981">ok</tspan> → <tspan fill="#ef4444" font-weight="700">DOWN</tspan>.</text>
    <text x="36" y="724" fill="#94a3b8" font-size="12.5">Context: <tspan fill="#fca5a5">Network crashed completely</tspan></text>
    <text x="366" y="768" fill="#6c8ba8" font-size="11">12:35</text>
  </g>

  <!-- Bottom Message Bar -->
  <rect y="806" width="420" height="54" fill="#17212b"/>
  <circle cx="36" cy="833" r="14" fill="none" stroke="#6c8ba8" stroke-width="1.8"/>
  <text x="70" y="838" fill="#6c8ba8" font-size="14">Message</text>
  <path d="M380 833 m-10 -10 l20 10 l-20 10 l6 -10 z" fill="#5288c1"/>
</svg>
