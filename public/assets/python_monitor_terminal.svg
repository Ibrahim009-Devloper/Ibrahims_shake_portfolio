  <!-- Code Editor Body (main.py) -->
  <rect x="220" y="72" width="780" height="240" fill="#181818"/>
  <text x="236" y="96" fill="#6a9955" font-size="11.5">"""Command-line entry point for the price monitoring bot."""</text>
  <text x="236" y="118" fill="#569cd6" font-size="12">import <tspan fill="#9cdcfe">argparse, sys</tspan></text>
  <text x="236" y="138" fill="#569cd6" font-size="12">from <tspan fill="#4ec9b0">monitor.runner</tspan> import <tspan fill="#dcdcaa">run_once</tspan></text>
  <text x="236" y="158" fill="#569cd6" font-size="12">from <tspan fill="#4ec9b0">monitor.utils.logging_setup</tspan> import <tspan fill="#dcdcaa">setup_logging</tspan></text>
  <text x="236" y="186" fill="#569cd6" font-size="12">def <tspan fill="#dcdcaa">parse_args</tspan>():</text>
  <text x="260" y="206" fill="#9cdcfe" font-size="12">parser = <tspan fill="#4ec9b0">argparse.ArgumentParser</tspan>(description=<tspan fill="#ce9178">"E-commerce Price Monitoring Bot"</tspan>)</text>
  <text x="260" y="226" fill="#9cdcfe" font-size="12">parser.add_argument(<tspan fill="#ce9178">"--site"</tspan>, type=str, help=<tspan fill="#ce9178">"Optional name filter e.g. Soko Glam"</tspan>)</text>
  <text x="260" y="246" fill="#569cd6" font-size="12">return <tspan fill="#9cdcfe">parser.parse_args()</tspan></text>

