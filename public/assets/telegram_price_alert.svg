<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%" style="background:#0e1621; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="tgHeaderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#17212b"/>
      <stop offset="100%" stop-color="#242f3d"/>
    </linearGradient>
    <linearGradient id="tgBubbleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182533"/>
      <stop offset="100%" stop-color="#202f42"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Status Bar -->
  <rect width="420" height="42" fill="#17212b"/>
  <text x="24" y="27" fill="#ffffff" font-size="14" font-weight="600">12:39</text>
  <path d="M352 18 h16 v10 h-16 z M370 21 h3 v4 h-3 z" fill="#a0b3c6"/>
  <text x="320" y="27" fill="#a0b3c6" font-size="12">53%</text>

  <!-- Telegram Chat Header -->
  <rect y="42" width="420" height="64" fill="url(#tgHeaderGrad)"/>
  <!-- Back Arrow -->
  <path d="M26 74 l10 -10 m-10 10 l10 10 m-10 -10 h24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bot Avatar -->
  <circle cx="92" cy="74" r="22" fill="#6c5ce7"/>
  <text x="92" y="81" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">E</text>
  <!-- Bot Name & Status -->
  <text x="126" y="69" fill="#ffffff" font-size="16" font-weight="600">E-commerce_price_monitor</text>
  <text x="126" y="87" fill="#6ab3f8" font-size="12">bot · automated price tracker</text>
  <!-- Three dots menu -->
  <circle cx="390" cy="68" r="2.5" fill="#ffffff"/>
  <circle cx="390" cy="74" r="2.5" fill="#ffffff"/>
  <circle cx="390" cy="80" r="2.5" fill="#ffffff"/>

  <!-- Chat Wallpaper Background -->
  <rect y="106" width="420" height="700" fill="#0e1621"/>

  <!-- Date Pill -->
  <rect x="160" y="122" width="100" height="24" rx="12" fill="#182533" opacity="0.9"/>
  <text x="210" y="138" fill="#7da3c6" font-size="11.5" font-weight="600" text-anchor="middle">October 8</text>

  <!-- Alert Bubble 1: Back in Stock -->
  <g filter="url(#cardShadow)">
    <rect x="18" y="162" width="384" height="226" rx="14" fill="url(#tgBubbleGrad)" stroke="#2b5278" stroke-width="1.2"/>
    <!-- Alert Header -->
    <text x="36" y="196" fill="#ffd166" font-size="16" font-weight="700">🔔 Price Monitor Alert</text>
    <rect x="36" y="210" width="112" height="24" rx="6" fill="rgba(16,185,129,0.2)"/>
    <text x="44" y="227" fill="#10b981" font-size="12" font-weight="700">✓ Back in Stock</text>
    <!-- Product Details -->
    <text x="36" y="258" fill="#ffffff" font-size="14.5" font-weight="600">• Dermalogy Double Vita Spot</text>
    <text x="46" y="278" fill="#ffffff" font-size="14.5" font-weight="600">Toning Serum (RC)</text>
    <text x="36" y="306" fill="#8cb4db" font-size="13">🏢 Site: <tspan fill="#ffffff" font-weight="600">Glow Beauty (Playwright)</tspan></text>
    <text x="36" y="330" fill="#8cb4db" font-size="13">📦 Stock: <tspan fill="#ef4444">Out of Stock</tspan> → <tspan fill="#10b981" font-weight="700">Back in Stock</tspan></text>
    <!-- Action Button -->
    <rect x="36" y="346" width="130" height="28" rx="6" fill="#2b5278"/>
    <text x="101" y="365" fill="#54a9eb" font-size="12" font-weight="600" text-anchor="middle">🔗 View Product</text>
    <text x="366" y="376" fill="#6c8ba8" font-size="11">14:24</text>
  </g>

  <!-- Alert Bubble 2: New Products Added Summary -->
  <g filter="url(#cardShadow)">
    <rect x="18" y="404" width="384" height="152" rx="14" fill="url(#tgBubbleGrad)" stroke="#2b5278" stroke-width="1.2"/>
    <rect x="36" y="422" width="46" height="20" rx="4" fill="#2f6ea5"/>
    <text x="42" y="436" fill="#ffffff" font-size="10" font-weight="700">NEW</text>
    <text x="88" y="437" fill="#64b5f6" font-size="14" font-weight="700">New Products Added Summary</text>
    <!-- Summary body -->
    <text x="36" y="470" fill="#8cb4db" font-size="13">🏢 <tspan fill="#ffffff" font-weight="600">yanybeauty:</tspan> 1 new product (1 variant)</text>
    <text x="48" y="494" fill="#ffffff" font-size="13.5" font-weight="600">• Award-Winning Mango Breeze</text>
    <text x="58" y="514" fill="#ffffff" font-size="13.5" font-weight="600">Refreshing Eye Serum</text>
    <text x="366" y="542" fill="#6c8ba8" font-size="11">14:24</text>
  </g>

  <!-- Alert Bubble 3: Price Drop & Variant Alert -->
  <g filter="url(#cardShadow)">
    <rect x="18" y="572" width="384" height="216" rx="14" fill="url(#tgBubbleGrad)" stroke="#2b5278" stroke-width="1.2"/>
    <text x="36" y="606" fill="#ffd166" font-size="16" font-weight="700">🔔 Price Monitor Alert</text>
    <rect x="36" y="620" width="108" height="22" rx="4" fill="#2f6ea5"/>
    <text x="42" y="635" fill="#ffffff" font-size="10.5" font-weight="700">NEW</text>
    <text x="74" y="635" fill="#ffffff" font-size="11" font-weight="600">New Variants</text>
    <text x="36" y="668" fill="#ffffff" font-size="14.5" font-weight="600">• Pure Fit Cica Calming True Sheet Mask</text>
    <text x="36" y="694" fill="#8cb4db" font-size="13">🏢 Site: <tspan fill="#ffffff" font-weight="600">Soko Glam Skincare</tspan></text>
    <text x="36" y="718" fill="#ffd166" font-size="14" font-weight="700">✨ Price: $6.00</text>
    <rect x="36" y="734" width="130" height="28" rx="6" fill="#2b5278"/>
    <text x="101" y="753" fill="#54a9eb" font-size="12" font-weight="600" text-anchor="middle">🔗 View Product</text>
    <text x="366" y="774" fill="#6c8ba8" font-size="11">12:38</text>
  </g>

  <!-- Bottom Message Input Bar -->
  <rect y="806" width="420" height="54" fill="#17212b"/>
  <circle cx="36" cy="833" r="14" fill="none" stroke="#6c8ba8" stroke-width="1.8"/>
  <text x="70" y="838" fill="#6c8ba8" font-size="14">Message</text>
  <path d="M380 833 m-10 -10 l20 10 l-20 10 l6 -10 z" fill="#5288c1"/>
</svg>
